name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Privacy gate first (plan §7): no committed file may contain the
      # user's identity or a private-tracker company. The blocklist is
      # hashes-only, so this needs no access to the private data repo.
      - name: Privacy guard
        run: node scripts/privacy-guard.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit + golden tests. Suites that need the private data repo skip
      # themselves when CAREER_OPS_PATH is unset (by design in CI).
      - name: Unit tests
        run: pnpm test

      # The deploy guard must FAIL a Vercel-like build without DEMO_MODE —
      # prove the gate still trips (it throws at config load, so this is fast).
      - name: Deploy guard trips without DEMO_MODE
        run: |
          if VERCEL=1 DEMO_MODE= pnpm build; then
            echo "::error::Build succeeded with VERCEL set and DEMO_MODE unset — the privacy gate is broken."
            exit 1
          fi

      - name: Build (demo mode)
        run: DEMO_MODE=true pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Demo-mode e2e + axe scans (dark & light). E2E_SKIP_BUILD reuses the
      # build from the previous step (the webServer then only runs `next start`).
      - name: E2E (demo mode)
        run: E2E_SKIP_BUILD=1 pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
